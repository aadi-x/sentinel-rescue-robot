<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SENTINEL Mobile Uplink</title><style>body{font:16px system-ui;background:#0a0e13;color:#e7edf3;margin:20px;max-width:600px}video,input,button{box-sizing:border-box;width:100%;margin:8px 0}video{background:#000}input,button{padding:12px;border-radius:6px;border:1px solid #1f2b38}button{background:#33e08a;font-weight:700}#status{color:#4a9eff}</style></head><body><h1>SENTINEL Mobile Camera</h1><p id="status">Open through the HTTPS tunnel, then allow Camera and Location.</p><video id="camera" autoplay muted playsinline></video><input id="robot" value="sentinel-01" aria-label="Robot ID"><input id="temp" type="number" placeholder="External DHT22 temperature C (optional)"><button id="start">START LIVE UPLINK</button><script>const video=document.querySelector('#camera'),status=document.querySelector('#status');let position={},timer,battery=null,busy=false;async function getBattery(){if(navigator.getBattery){try{battery=(await navigator.getBattery()).level*100}catch{}}}async function shot(){let c=document.createElement('canvas');c.width=video.videoWidth;c.height=video.videoHeight;c.getContext('2d').drawImage(video,0,0);return new Promise(done=>c.toBlob(done,'image/jpeg',.7))}async function send(){if(busy||!video.videoWidth)return;busy=true;let temp=document.querySelector('#temp').value,form=new FormData();form.append('meta',JSON.stringify({robot_id:document.querySelector('#robot').value,latitude:position.latitude,longitude:position.longitude,battery_pct:battery,temperature_c:temp===''?null:+temp,transcript:''}));form.append('image',await shot(),'phone-camera.jpg');try{let r=await fetch('/api/observe',{method:'POST',body:form}),e=await r.json();if(!r.ok)throw new Error(e.detail||'upload failed');status.textContent=`LIVE • ${e.priority} • Critical score ${e.critical_score}%`;}catch(e){status.textContent='Upload error: '+e.message}finally{busy=false}}document.querySelector('#start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Use the HTTPS trycloudflare.com/mobile URL');video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});await getBattery();navigator.geolocation.watchPosition(x=>position=x.coords,()=>status.textContent='Camera on, but GPS was denied/unavailable',{enableHighAccuracy:true});clearInterval(timer);timer=setInterval(send,700);send();status.textContent='Live uplink is running';}catch(e){status.textContent='Permission error: '+e.message}};</script></body></html>
